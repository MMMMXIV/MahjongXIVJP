name: Build and publish MahjongXIVJP

on:
  push:
    branches: [main]
    paths:
      - 'Directory.Build.props'
      - 'MahjongXiv/**'
      - 'MahjongXiv.Engine/**'
      - 'tests/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mahjongxivjp-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Dalamud development assemblies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:APPDATA 'XIVLauncher/addon/Hooks/dev'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile dalamud-dev.zip
          Expand-Archive -Path dalamud-dev.zip -DestinationPath $dest -Force
          if (-not (Test-Path (Join-Path $dest 'Dalamud.dll'))) { throw 'Dalamud.dll is missing from the SDK directory' }

      - name: Restore and build plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore MahjongXiv.slnx
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
          dotnet build MahjongXiv.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Plugin build failed' }

      - name: Run engine tests
        shell: pwsh
        run: |
          dotnet test tests/MahjongXiv.Engine.Tests/MahjongXiv.Engine.Tests.csproj -c Release --no-restore --logger trx --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { throw 'Engine tests failed' }

      - name: Validate package and update repository metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$props = Get-Content -Raw 'Directory.Build.props'
          $identity = @($props.Project.PropertyGroup | Where-Object { $_.Label -eq 'Identity' })[0]
          $version = [string]$identity.Version
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$') { throw "Unexpected version: $version" }
          $source = 'MahjongXiv/bin/x64/Release/MahjongXIVJP/latest.zip'
          if (-not (Test-Path $source)) { throw "Packager output missing: $source" }

          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $source).Path)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName })
            if (-not ($entries | Where-Object { $_ -match '(^|/)MahjongXIVJP\.dll$' })) { throw 'Plugin DLL not found in ZIP' }
            if (-not ($entries | Where-Object { $_ -match '(^|/)MahjongXIVJP\.json$' })) { throw 'Dalamud manifest not found in ZIP' }
          } finally {
            $zip.Dispose()
          }

          $target = "dist/MahjongXIVJP-$version.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $source $target -Force
          $manifest = @(Get-Content -Raw 'repo.json' | ConvertFrom-Json)
          if ($manifest.Count -ne 1 -or $manifest[0].InternalName -ne 'MahjongXIVJP') { throw 'Unexpected repo.json structure' }
          $entry = $manifest[0]
          $entry.AssemblyVersion = $version
          $uri = "https://raw.githubusercontent.com/MMMMXIV/MahjongXIVJP/main/dist/MahjongXIVJP-$version.zip"
          $entry.DownloadLinkInstall = $uri
          $entry.DownloadLinkUpdate = $uri
          $entry.DownloadLinkTesting = $uri
          $entry.LastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $entry.Changelog = '状態6/28の強制打牌・不明イベントへのフォールバック・同一鳴きの再送を廃止。配牌/結果画面はゲーム側の進行を尊重。状態確認・安全停止・診断ログと回帰テストを追加。実対局でのクラッシュ解消は継続確認中。'
          ConvertTo-Json -InputObject $manifest -Depth 16 | Set-Content -Path repo.json -Encoding utf8

          Write-Host "Version: $version"
          Write-Host "Package: $target"
          Get-FileHash -Algorithm SHA256 $target | Format-Table -AutoSize
          "PACKAGE_PATH=$target" >> $env:GITHUB_ENV

      - name: Commit built ZIP and version metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist repo.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No publishing changes'
            exit 0
          }
          git commit -m 'Publish corrected MahjongXIVJP binary and repository metadata'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Push failed' }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: MahjongXIVJP-package
          path: ${{ env.PACKAGE_PATH }}
